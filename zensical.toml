# Curated navigation, ordered by the Diátaxis quadrants (tutorial → how-to →
# explanation → reference).
nav = [
  { Home = "index.md" },
  { Tutorials = [ { "Getting started" = "tutorials/getting-started.md" } ] },
  { "How-to guides" = [
    { "Write actionable errors" = "how-to/actionable-errors.md" },
    { "Control the exit code" = "how-to/exit-codes.md" },
    { "Handle interrupts quietly" = "how-to/handle-interrupts.md" },
    { "Print usage for a parent command" = "how-to/print-usage.md" },
    { "Add a support channel" = "how-to/support-channel.md" },
    { "Test error handling" = "how-to/test-error-handling.md" },
  ] },
  { Explanation = [
    { "The reporting model" = "explanation/reporting-model.md" },
    { "Why cockroachdb/errors" = "explanation/why-cockroachdb-errors.md" },
  ] },
  { Reference = [
    { Overview = "reference/index.md" },
    { "API reference" = "reference/api.md" },
    { "Report levels" = "reference/levels.md" },
    { "Exit codes" = "reference/exit-codes.md" },
    { "Log fields" = "reference/log-fields.md" },
    { Limitations = "reference/limitations.md" },
  ] },
  { "Go API (pkg.go.dev)" = "https://pkg.go.dev/gitlab.com/phpboyscout/go/errorhandling" },
]

[project]
site_name = "errorhandling"
site_description = "Structured, user-friendly error reporting for Go CLIs — actionable hints, exit codes carried on the error, and debug-gated stack traces"
site_author = "Matt Cockayne"
site_url = "https://errorhandling.go.phpboyscout.uk"
repo_url = "https://gitlab.com/phpboyscout/go/errorhandling"
repo_name = "phpboyscout/go/errorhandling"
copyright = "Copyright &copy; 2026 Matt Cockayne"

[project.theme]
logo = "images/branding/logo_transparent.svg"
favicon = "images/branding/favicon.svg"
language = "en"
features = [
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

